[project]
name = "rag-multi-modal-agentique"
version = "0.1.0"
description = "RAG multimodal local avec CLIP, Chroma, Ollama, LangChain et MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.4.0",
    "langchain>=1.4.9",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "matplotlib>=3.11.2",
    "mcp>=1.12,<2",
    "nvidia-smi>=0.1.3",
    "ollama>=0.6.3",
    "open-clip-torch>=4.2.1",
    "openai>=3.46.0",
    "pillow>=13.0.0",
    "pymupdf>=2.1",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
